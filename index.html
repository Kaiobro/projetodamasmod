<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crossfade Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; }
        #joystick-zone { 
            position: fixed; bottom: 50px; left: 50px; 
            width: 120px; height: 120px; z-index: 1000; 
            display: none; 
        }
    </style>
</head>
<body>
    <div id="joystick-zone"></div>

    <script>
    const config = {
        type: Phaser.AUTO, // Detecta se o celular usa WebGL (mais rápido) ou Canvas
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        width: 1280, height: 720,
        physics: { 
            default: 'arcade', 
            arcade: { gravity: { y: 0 }, debug: false } 
        },
        scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);
    let player, barreiras, bg, joystickData = { x: 0, y: 0 }, fase = 'capa';

    function preload() {
        // Carregamento de ativos na memória antes de começar
        this.load.image('capa', 'capa.png');
        this.load.image('mapa', 'mapa.png');
        this.load.image('jogador', 'jogador.png');
        this.load.image('carta', 'carta.png');
    }

    function create() {
        // Camada 1: Cenário
        bg = this.add.image(640, 360, 'capa').setInteractive();

        // Camada 2: Barreiras Físicas (Onde o boneco bate e para)
        barreiras = this.physics.add.staticGroup();
        // Exemplo de barreira na Escola (Ajuste as coordenadas conforme seu mapa)
        barreiras.add(this.add.rectangle(500, 200, 150, 150)); 
        barreiras.getChildren().forEach(b => b.setVisible(false));

        // Camada 3: Jogador (Com física de colisão)
        player = this.physics.add.sprite(640, 500, 'jogador').setScale(0.7).setVisible(false);
        player.setCollideWorldBounds(true); // Não deixa sair da tela
        
        // Ativa a "batida" entre jogador e parede
        this.physics.add.collider(player, barreiras);

        // Início por clique (padrão de jogos mobile)
        bg.on('pointerdown', () => {
            if(fase === 'capa') {
                alert("O jogo vai começar!");
                iniciarGameplay(this);
            }
        });
    }

    function iniciarGameplay(scene) {
        fase = 'mapa';
        bg.setTexture('mapa');
        player.setVisible(true);
        document.getElementById('joystick-zone').style.display = 'block';

        // Inicializa o Joystick
        const options = { zone: document.getElementById('joystick-zone'), mode: 'static', position: { left: '60px', bottom: '60px' } };
        const manager = nipplejs.create(options);
        
        manager.on('move', (evt, data) => {
            const speed = 300;
            joystickData.x = data.vector.x * speed;
            joystickData.y = -data.vector.y * speed;
        });
        
        manager.on('end', () => { joystickData.x = 0; joystickData.y = 0; });
    }

    function update() {
        // Este é o loop do jogo. Roda 60x por segundo.
        if(player.visible && player.body) {
            player.body.setVelocity(joystickData.x, joystickData.y);
            
            // Lógica de animação simples (opcional)
            if (joystickData.x > 0) player.setFlipX(false);
            else if (joystickData.x < 0) player.setFlipX(true);
        }
    }
    </script>
</body>
</html>
