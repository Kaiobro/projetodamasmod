<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crossfade - Sincronizando Propósitos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #game-container { width: 100vw; height: 100vh; }
        #joystick-zone { position: fixed; bottom: 40px; left: 40px; width: 120px; height: 120px; z-index: 1000; }
        #papel-carta {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 260px; padding: 20px; background: #fdf5e6; border: 2px solid #d2b48c;
            display: none; z-index: 1001; text-align: center; border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="joystick-zone"></div>
    <div id="game-container"></div>
    <div id="papel-carta">
        <p id="texto-carta"></p>
        <button onclick="document.getElementById('papel-carta').style.display='none'">Fechar</button>
    </div>

    <script>
    const config = {
        type: Phaser.AUTO,
        parent: 'game-container',
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        width: 800, height: 600,
        physics: { default: 'arcade' },
        scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);
    let player, joystickData = { x: 0, y: 0 }, fase = 'capa';

    function preload() {
        // Nomes exatos da sua pasta no GitHub
        this.load.image('capa', 'capa.png');
        this.load.image('mapa', 'mapa.png');
        this.load.image('jogador', 'jogador.png');
        this.load.image('carta', 'carta.png');
        this.load.image('atmosfera', 'atmosfera.png');
    }

    function create() {
        // Fundo inicial
        let bg = this.add.image(400, 300, 'capa').setInteractive();
        bg.setDisplaySize(800, 600);

        // Boneco (jogador.png)
        player = this.physics.add.sprite(400, 300, 'jogador').setVisible(false);
        player.setCollideWorldBounds(true);

        // Ao clicar na capa, o jogo começa
        bg.on('pointerdown', () => {
            if(fase === 'capa') {
                fase = 'mapa';
                bg.setTexture('mapa');
                player.setVisible(true);
                alert("Missão Iniciada! Use o analógico para coletar as cartas.");
            }
        });

        // Joystick NippleJS
        const manager = nipplejs.create({
            zone: document.getElementById('joystick-zone'),
            mode: 'static', position: { left: '60px', bottom: '60px' }, color: 'white'
        });
        manager.on('move', (evt, data) => { 
            joystickData.x = data.vector.x; 
            joystickData.y = -data.vector.y; 
        });
        manager.on('end', () => { joystickData.x = 0; joystickData.y = 0; });
    }

    function update() {
        if(player.visible) {
            player.body.setVelocity(joystickData.x * 250, joystickData.y * 250);
        }
    }
    </script>
</body>
</html>
