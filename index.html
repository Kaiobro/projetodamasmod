<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crossfade - Sincronizando Propósitos</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        #joystick-zone { position: fixed; bottom: 30px; left: 30px; width: 100px; height: 100px; z-index: 1000; }
        #papel-carta {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 280px; padding: 20px; background: #fdf5e6; border: 3px solid #d2b48c;
            display: none; z-index: 1001; text-align: center; border-radius: 10px; color: #5d4037;
        }
        #tela-final {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffc0cb; display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 2000;
        }
        .btn-final { padding: 15px 30px; font-size: 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; }
        #btn-sim { background: #4caf50; color: white; }
        #btn-nao { background: #f44336; color: white; position: absolute; }
    </style>
</head>
<body>

    <div id="joystick-zone"></div>
    <div id="papel-carta">
        <p id="texto-carta"></p>
        <button onclick="fecharCarta()" style="cursor:pointer; padding: 5px 15px;">Fechar</button>
    </div>

    <div id="tela-final">
        <h2 id="frase-final" style="text-align: center; padding: 20px; color: #d32f2f;"></h2>
        <div style="position: relative; width: 100%; height: 300px; display: flex; justify-content: center; align-items: center;">
            <button id="btn-sim" class="btn-final" onclick="aceitou()">Sim, Claro!</button>
            <button id="btn-nao" class="btn-final" onmouseover="fugir()" ontouchstart="fugir()">Nãoooo!</button>
        </div>
    </div>

    <script>
    const config = {
        type: Phaser.AUTO,
        width: window.innerWidth,
        height: window.innerHeight,
        parent: 'game-container',
        physics: { default: 'arcade' },
        scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);
    let player, cartas, igrejaObjeto, joystickData = { x: 0, y: 0 }, contador = 0, fase = 'capa';
    let bg, vocal, pulpito, portal;

    function preload() {
        // NOMES DE ACORDO COM O SEU GITHUB
        this.load.image('capa', 'capa.png'); 
        this.load.image('mapa_img', 'mapa.png');
        this.load.image('jogador', 'jogador.png'); 
        this.load.image('kaio_img', 'kaio.png');
        this.load.image('carta_img', 'carta.png');
        this.load.image('atmosfera', 'atmosfera.png');
        this.load.image('vocal_img', 'vocal.png');
        this.load.image('pulpito_img', 'pulpito.png');
        this.load.image('paisagem', 'paisagem.png');
    }

    function create() {
        bg = this.add.image(window.innerWidth/2, window.innerHeight/2, 'capa').setInteractive();
        bg.setDisplaySize(window.innerWidth, window.innerHeight);

        // Clique inicial na capa
        bg.on('pointerdown', () => {
            if(fase === 'capa') iniciarMapa(this);
        });

        const joystick = nipplejs.create({
            zone: document.getElementById('joystick-zone'),
            mode: 'static', position: { left: '75px', bottom: '75px' }, color: 'white'
        });
        joystick.on('move', (evt, data) => { joystickData.x = data.vector.x; joystickData.y = -data.vector.y; });
        joystick.on('end', () => { joystickData.x = 0; joystickData.y = 0; });
    }

function iniciarMapa(scene) {
        fase = 'mapa';
        bg.setTexture('mapa_img');
        alert("Bom ver você, Primeira dama! Vamos começar.");
        alert("Espalhei 5 cartas. Ache todas e me encontre na igreja.");

        player = scene.physics.add.sprite(100, window.innerHeight - 100, 'jogador').setScale(1.5);
        player.setCollideWorldBounds(true);

        // Representação invisível da igreja no mapa
        igrejaObjeto = scene.add.rectangle(window.innerWidth - 100, 150, 100, 100);
        scene.physics.add.existing(igrejaObjeto, true);

        cartas = scene.physics.add.group();
        const mensagens = [
            "Carta 01: Deus preparou aquele nosso dia. Ainda bem que meu caminho cruzou com o seu.",
            "Carta 02: Eu estava desacreditado, mas você chegou e mudou tudo.",
            "Carta 03: Não muda nada em você. Seu jeito é o que te faz única.",
            "Carta 04: Valeu cada oração. Ter você por perto me traz uma paz absurda.",
            "Carta 05: Por você eu faço o impossível. Você é minha 'Primeira Dama'."
        ];

        for(let i=0; i<5; i++) {
            let c = cartas.create(Phaser.Math.Between(50, window.innerWidth-50), Phaser.Math.Between(150, window.innerHeight-50), 'carta_img');
            c.msg = mensagens[i];
            c.setScale(0.5);
        }

        scene.physics.add.overlap(player, cartas, (p, c) => {
            document.getElementById('texto-carta').innerText = c.msg;
            document.getElementById('papel-carta').style.display = 'block';
            c.destroy();
            contador++;
            if(contador === 5) alert("Mandou bem! Me encontra na igreja.");
        });

        scene.physics.add.overlap(player, igrejaObjeto, () => {
            if(contador >= 5 && fase === 'mapa') iniciarIgreja(scene);
        });
    }

    function iniciarIgreja(scene) {
        fase = 'igreja';
        player.setPosition(window.innerWidth/2, window.innerHeight - 100);
        bg.setTexture('atmosfera');
        
        vocal = scene.add.image(window.innerWidth/2, 200, 'vocal_img').setScale(1.2);
        pulpito = scene.add.image(window.innerWidth/2, 280, 'pulpito_img');
        let kaio = scene.add.image(window.innerWidth/2 - 100, window.innerHeight - 150, 'kaio_img');

        alert("Ainda bem que você chegou... tava te esperando.");
        alert("Preciso de ajuda para o registro do culto. Segura o estabilizador?");
        alert("Tira 3 fotos do vocal e um vídeo de 5 segundos.");

        setTimeout(() => {
            alert("Pronto, perfeito! Conseguiu registrar tudo.");
            alert("Agora vem cá... essa aqui é a nossa última missão.");
            iniciarPortal(scene);
        }, 8000);
    }

    function iniciarPortal(scene) {
        fase = 'final';
        bg.setTexture('paisagem');
        vocal.destroy();
        pulpito.destroy();
        document.getElementById('tela-final').style.display = 'flex';
        document.getElementById('frase-final').innerText = "A real é que você supera tudo o que eu um dia sonhei. Não quero que você seja só uma fase, quero você no meu presente.\nAceita ser minha dupla na mídia e na vida?\nQuer namorar comigo?";
    }

    function update() {
        if(player && player.body) {
            player.setVelocity(joystickData.x * 200, joystickData.y * 200);
        }
    }

    function fecharCarta() { document.getElementById('papel-carta').style.display = 'none'; }
    function fugir() {
        let btn = document.getElementById('btn-nao');
        btn.style.left = Math.random() * 60 + 20 + "%";
        btn.style.top = Math.random() * 60 + 20 + "%";
    }
    function aceitou() {
        alert("ELA DISSE SIM! ❤️");
        document.body.innerHTML = "<div style='background:black; height:100vh; display:flex; align-items:center; justify-content:center;'><h1 style='color:white; text-align:center;'>💍 MINHA MELHOR ESCOLHA! ❤️</h1></div>";
    }
    </script>
</body>
</html>
